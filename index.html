<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>APPSC Group-2 Mock Test</title>
</head>
<body>

<h1>APPSC Group-2 Grand Mock Test</h1>

<p>Total Questions: 150</p>
<p>Negative Marking: 1/3</p>

<button onclick="startTest()">Start Test</button>

<div id="quiz-container"></div>

<script src="questions.js"></script>

<script>
function startTest(){

  const container = document.getElementById("quiz-container");

  let html = "";

  questions.forEach((q,index)=>{

    html += `
      <div style="margin-bottom:20px;">
        <h3>Q${index+1}. ${q.question}</h3>

        <label>
          <input type="radio" name="q${index}" value="a">
          ${q.options.a}
        </label><br>

        <label>
          <input type="radio" name="q${index}" value="b">
          ${q.options.b}
        </label><br>

        <label>
          <input type="radio" name="q${index}" value="c">
          ${q.options.c}
        </label><br>

        <label>
          <input type="radio" name="q${index}" value="d">
          ${q.options.d}
        </label>

        <hr>
      </div>
    `;
  });

  container.innerHTML = html;
}
</script>

</body>
</html>
